[package]
name = "hack-shell"
version = "0.1.0"
edition = "2021"
description = "CPU terminal for EndeavourOS with Wayland primary-selection paste"
license = "MIT"

[dependencies]
alacritty_terminal = "0.26"
egui = "0.36"
egui-winit = { version = "0.36", features = ["wayland", "x11"] }
env_logger = "0.11"
fontdue = "0.9"
log = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = "0.4"
vte = "0.15"
winit = { version = "0.30", features = ["wayland", "x11"] }
wl-clipboard-rs = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
